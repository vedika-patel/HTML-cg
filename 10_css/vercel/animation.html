<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            background-color: black;
            justify-content: center;
        }
        .tues{
            display:flex;
            border: 2px solid rgb(246, 235, 235);
            border-radius: 50%;
            height: 800px;
            width: 800px;
            justify-content: center;
            animation-name:spin-circle;
            animation-duration: 6s;
            animation-iteration-count:infinite;
            animation-delay: 2s;
        }
        .wed{
            display:flex;
            border: 2px solid rgb(246, 235, 235);
            border-radius: 50%;
            height: 700px;
            width: 700px;
            justify-content: center;
            margin: auto;
        }
        .fry{
            display:flex;
            border: 2px solid rgb(246, 235, 235);
            border-radius: 50%;
            height: 600px;
            width: 600px;
            justify-content: center;
            margin: auto;
        }
        .earth{
             display:flex;
            border: 2px solid rgb(246, 235, 235);
            border-radius: 50%;
            height: 450px;
            width: 450px;
            justify-content: center;
            margin: auto;
        }
        .sun{
            display:flex;
            border: 2px solid rgb(30, 30, 29);
            border-radius: 50%;
            height: 200px;
            width: 200px;
            justify-content: center;
            margin: auto;
            background-color: yellow;
        }
    
    </style>
</head>
<body>
    <div class="tues">
        <div class="wed">
         <div class="fry">
           <div class="earth">
            <img src="/image.html/nasa-vhSz50AaFAs-unsplash.jpg" height="100px">
            <div class="sun">
                <img src="https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e001435/GSFC_20171208_Archive_e001435~large.jpg?w=1920&h=1920&fit=clip&crop=faces%2Cfocalpoint">
            </div>
           </div>
        </div>
        </div>
       
        
    </div>
</body>
</html>
