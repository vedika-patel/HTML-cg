
<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        background-image:;
    }

    .solar-system {
        width: 750px;
        height: 750px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .sun {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 40px orange;
        position: absolute;
    }

    .sun img,
    .planet img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        display: block;
    }

    .orbit {
        position: absolute;
        border: 1px solid #777;
        border-radius: 50%;
        animation: spin linear infinite;
    }

    .orbit-1 { width: 160px; height: 160px; animation-duration: 4s; }
    .orbit-2 { width: 250px; height: 250px; animation-duration: 6s; }
    .orbit-3 { width: 350px; height: 350px; animation-duration: 9s; }
    .orbit-4 { width: 470px; height: 470px; animation-duration: 12s; }
    .orbit-5 { width: 600px; height: 600px; animation-duration: 16s; }

    .planet {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
    }

    .planet-1 { width: 22px; height: 22px; top: 0; }
    .planet-2 { width: 30px; height: 30px; top: 0; }
    .planet-3 { width: 34px; height: 34px; top: 0; }
    .planet-4 { width: 28px; height: 28px; top: 0; }
    .planet-5 { width: 50px; height: 50px; top: 0; }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>

<div class="solar-system">

    <!-- Sun -->
    <div class="sun">
        <img src="https://images-assets.nasa.gov/image/PIA03149/PIA03149~orig.jpg"
             alt="Sun">
    </div>

    <!-- Mercury -->
    <div class="orbit orbit-1">
        <div class="planet planet-1">
            <img src="https://images-assets.nasa.gov/image/PIA19400/PIA19400~orig.jpg"
                 alt="Mercury">
        </div>
    </div>

    <!-- Venus -->
    <div class="orbit orbit-2">
        <div class="planet planet-2">
            <img src="https://images-assets.nasa.gov/image/PIA00271/PIA00271~orig.jpg"
                 alt="Venus">
        </div>
    </div>

    <!-- Earth -->
    <div class="orbit orbit-3">
        <div class="planet planet-3">
            <img src="https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg"
                 alt="Earth">
        </div>
    </div>

    <!-- Mars -->
    <div class="orbit orbit-4">
        <div class="planet planet-4">
            <img src="https://images-assets.nasa.gov/image/PIA04591/PIA04591~orig.jpg"
                 alt="Mars">
        </div>
    </div>

    <!-- Jupiter -->
    <div class="orbit orbit-5">
        <div class="planet planet-5">
            <img src="https://images-assets.nasa.gov/image/PIA02873/PIA02873~orig.jpg"
                 alt="Jupiter">
        </div>
    </div>

</div>
