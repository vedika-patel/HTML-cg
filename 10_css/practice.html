<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel UI - Must See Places</title>
  <style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background-color: #d1d5db;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Main Container Window */
.container {
  width: 90%;
  max-width: 1200px;
  background: linear-gradient(135deg, #e4ece9 0%, #ede8f5 50%, #e0e5eb 100%);
  border-radius: 12px;
  padding: 40px 60px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 650px;
  
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;

  
}

.logo {
  font-weight: 800;
  font-size: 24px;
  color: #0d0f2b;
  letter-spacing: -0.5px;
}

.sub-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #6b7280;
  text-transform: uppercase;
}

.nav-links a {
  text-decoration: none;
  color: #4b5563;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin-left: 30px;
}

/* Main Layout */
.content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
  margin: 20px 0;
}

/* Left Hero Section */
.hero-section {
  flex: 1;
  max-width: 340px;
}

.hero-section h1 {
  font-size: 52px;
  line-height: 1.05;
  color: #0b0c2a;
  font-weight: 800;
  margin-bottom: 20px;
}

.hero-section p {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.btn-explore {
  background: linear-gradient(90deg, #ff3366, #ff6542);
  color: white;
  border: none;
  padding: 12px 36px;
  border-radius: 25px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 8px 15px rgba(255, 51, 102, 0.3);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn-explore:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 20px rgba(255, 51, 102, 0.4);
}

/* Right Cards Section */
.slider-section {
  flex: 2;
}

.card-container {
  display: flex;
  gap: 20px;
}

.card {
  position: relative;
  flex: 1;
  height: 380px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
  color: white;
}

.card-overlay h3 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 4px;
}

.card-overlay p {
  font-size: 10px;
  letter-spacing: 1.5px;
  opacity: 0.8;
}

.card-overlay i {
  color: #ff3366;
  margin-right: 4px;
}

/* Footer Section */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
}

.social-icons a {
  color: #4b5563;
  margin-right: 15px;
  font-size: 13px;
  text-decoration: none;
}

.footer-center {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #6b7280;
}

.footer-controls {
  display: flex;
  align-items: center;
  gap: 20px;
}

.pagination {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #2b6cc8;
}

.arrow-buttons {
  display: flex;
  gap: 10px;
}

.btn-arrow {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid #d1d5db;
  background-color: transparent;
  color: #374151;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-arrow:hover {
  background-color: white;
  border-color: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
</style>
</head>
<body>

  <div class="container">
    <!-- Header / Navigation -->
    <header class="navbar">
      <div class="logo">travel.</div>
      <div class="sub-title">CARD SLIDER FOR WORDPRESS</div>
      <nav class="nav-links">
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content">
      
      <!-- Left Hero Text -->
      <section class="hero-section">
        <h1>Must see<br>Places</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin elementum metus eu enim rhoncus posuere.</p>
        <button class="btn-explore">Explore</button>
      </section>

      <!-- Right Slider Section -->
      <section class="slider-section">
        <div class="card-container">
          
          <!-- Card 1 -->
          <div class="card">
            <img src="https://images.unsplash.com/photo-1641128324972-af3212f0f6bd?auto=format&fit=crop&w=600&q=80" alt="Cappadocia">
            <div class="card-overlay">
              <h3>Cappadocia</h3>
              <p><i class="fa-solid fa-location-dot"></i> TURKEY</p>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="card">
            <img src="https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=600&q=80" alt="Santorini">
            <div class="card-overlay">
              <h3>Santorini</h3>
              <p><i class="fa-solid fa-location-dot"></i> GREECE</p>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="card">
            <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=600&q=80" alt="Bali">
            <div class="card-overlay">
              <h3>Bali</h3>
              <p><i class="fa-solid fa-location-dot"></i> INDONESIA</p>
            </div>
          </div>

        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="social-icons">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
        <a href="#"><i class="fa-solid fa-globe"></i></a>
      </div>

      <div class="footer-center">
        <span>UNIQUE DESTINATIONS</span>
      </div>

      <div class="footer-controls">
        <span class="pagination">01 / 03</span>
        <div class="arrow-buttons">
          <button class="btn-arrow" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn-arrow" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
