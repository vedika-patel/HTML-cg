<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #afd0f5;
            color: #38294b;
        }

        
        .container {
            width: 100%;
            min-height: 100vh;
            padding: 25px 30px;
            border-top: 5px solid #a0a5a5;
        }

        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        } 

        .menu {
            display: flex;
            gap: 40px;
        }

        .menu a {
            text-decoration: none;
            color: #555;
            font-size: 12px;
            font-weight: bold;
        }       

        
        .top-title {
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            color: #777;
            margin-top: -5px;
        }

        
        .main {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: 90px;
        }

    
        .text {
            width: 35%;
        }

        .text h1 {
            font-size: 58px;
            line-height: 0.95;
            margin-bottom: 30px;
        }

        .text p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #f03d61;
            color: white;
            padding: 15px 55px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
        }
        
        
        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
        }

        .bottom-title {
            font-size: 10px;
            letter-spacing: 2px;
            color: #777;
        }

        .number {
            font-size: 12px;
            color: #555;
        }

        .arrows button {
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            background: transparent;
            border-radius: 50%;
            margin-left: 8px;
            font-size: 18px;
        }

        
        @media (max-width: 900px) {
            .main {
                flex-direction: column;
            }

            .text {
                width: 100%;
            }

            .cards {
                width: 100%;
            }

            .card {
                height: 400px;
            }
        }
    </style>
</head>

<body>
    <body>

    <div class="container">

        <!-- Navbar -->
        <div class="navbar">
            <div class="logo">travel.</div>

            <div class="menu">
                <a href="#">ABOUT</a>
                <a href="#">CONTACT</a>
            </div>
        </div>

        <div class="top-title">
            CARD SLIDER FOR WORDPRESS
        </div>

        <!-- Main Section -->
        <div class="main">

            <!-- Text -->
            <div class="text">
                <h1>
                    Must see<br>
                    Places
                </h1>

                <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                    Proin elementum metus eu enim rhoncus posuere.
                </p>

                <a href="#" class="btn">Explore</a>
            </div>
