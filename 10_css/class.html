<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            display: flex;
            border: 2px solid black;
            height: 900px;
            width: 900px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            flex-grow: 2;
            align-self: flex-end;
            
        
        }
        .one{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            order: 1;
            flex-shrink: 2;
            align-self: flex-end;
        }
         .two{
            border: 2px solid red;
             width: 100px;
            height: 100px;
            order: 2;
        }
         .three{
            border: 2px solid red;
            height: 100px;
            width: 100px;
        }
         .four{
            border: 2px solid red;
            width: 100px;
            height: 100px;
        }
         .five{
            border: 2px solid red;
             width: 100px;
            height: 100px;
        }
         .six{
            border: 2px solid red;
             width: 100px;
            height: 100px;
            order: 3;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div class="four">4</div>
        <div class="five">5</div>
        <div class="six">6</div>

    </div>
    
</body>
</html>
