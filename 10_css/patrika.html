<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
 .per{
  perspective: 1000px;
  border: 2px solid black;
  margin: auto;
  width: 250px;
  
 }
 .child{
  background-color: rgb(52, 43, 226);
  height: 100px;
  width: 100px;
  padding: 20px;
  transition-delay: 2s;
  transition-duration: 3s;
  transition-property:all;
 }
 .per:hover >.child{
  background-color: red;
  transform: scale3d(1.3,2,5) rotate3d(1,1,1,45deg)
  
 }
  </style>
</head>
<body>
  <div class="per">
    <div class="child">hello vedika hoe are you gyse!</div>

  </div>
  
</body>
</html>
