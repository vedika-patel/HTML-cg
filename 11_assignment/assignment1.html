<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #dcdcdc;
    font-family: Arial, sans-serif;
    }
    .calculator{
        width: 320px;
        background-color: black;
        padding-inline: 20px;
        border: 35px;
     
    }
    .display{
        height: 90px;
        color: white;
        font-size: 80px;
        display: flex;
        align-items: flex-start;
        justify-content:flex-end;
        padding: 15px;

    }
    .middle{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        flex-wrap: wrap;
        row-gap:8px;

    }
    .button{
        display: flex;
        color: black;
        border-radius: 75px;
        background-color: gray;
        height: 75px;
        width: 75px;
        font-size: 30px;
        align-items: center;
        justify-content: center;
    }
    .orange_button{
        display: flex;
        color:white;
        border-radius: 75px;
        background-color: orange;
        height: 75px;
        width: 75px;
        font-size: 30px;
        align-items: center;
        justify-content: center;

    }
    .zero{
        display: flex;
        color: black;
        border-radius: 75px;
        background-color: gray;
        height: 75px;
        width: 155px;
        font-size: 30px;
        align-items: center;
        justify-content:center;
        

    }
    .last{
        padding-top: 10px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        flex-wrap: wrap;
        padding-bottom: 15px;

    }
    


    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">7744</div>
        <div class="middle">
            <div class="button">
                <p>C</p>
            </div>
            <div class="button">
                <p>+/-</p>
            </div>
            <div class="button">
                <p>%</p>
            </div>
            <div class="orange_button">
                <p>/</p>
            </div>
            <div class="button">
                <p>7</p>
            </div>
            <div class="button">
                <p>8</p>
            </div>
            <div class="button">
                <p>9</p>
            </div>
            <div class="orange_button">
                <p>x</p>
            </div>
            <div class="button">
                <p>4</p>
            </div>
            <div class="button">
                <p>5</p>
            </div>
            <div class="button">
                <p>6</p>
            </div>
            <div class="orange_button">
                <p>-</p>
            </div>
            <div class="button">
                <p>1</p>
            </div>
            <div class="button">
                <p>2</p>
            </div>
            <div class="button">
                <p>3</p>
            </div>
            <div class="orange_button">
                <p>+</p>
            </div>
        </div>    
        <div class="last">
            <div class="zero">
                <p>0</p>
            </div>
            <div class="button">
                <p>,</p>
            </div>
            <div class="orange_button">
                <p>=</p>
            </div>

        </div>
    </div>
</body>
</html>
