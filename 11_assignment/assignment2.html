
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku</title>
     <style>
/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {
    min-height: 100vh;

    background: #f6f7f9;

    color: #252a32;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   HEADER
========================= */

.header {
    height: 68px;

    background: #ffffff;

    border-bottom: 1px solid #e4e7eb;

    padding: 0 45px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}


.logo {
    font-size: 24px;
    font-weight: 700;

    color: #20252c;
}


.header-right {
    display: flex;
    align-items: center;

    gap: 10px;
}


.new-game,
.theme-btn {
    height: 38px;

    border: 1px solid #d9dde3;

    background: #ffffff;

    border-radius: 7px;

    color: #30353d;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}


.new-game {
    padding: 0 15px;
}


.theme-btn {
    width: 38px;

    font-size: 16px;
}


.new-game:hover,
.theme-btn:hover {
    background: #f1f3f6;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 440px;

    max-width: calc(100% - 30px);

    margin: 35px auto 60px;
}


/* =========================
   GAME INFORMATION
========================= */

.game-info {
    width: 100%;

    display: flex;
    justify-content: space-between;

    background: #ffffff;

    border: 1px solid #e0e4e9;

    border-radius: 10px;

    padding: 15px 20px;

    margin-bottom: 20px;
}


.info-item {
    display: flex;
    flex-direction: column;

    gap: 5px;
}


.info-item span {
    font-size: 10px;

    color: #858b94;

    font-weight: 600;

    letter-spacing: 0.7px;
}


.info-item strong {
    font-size: 14px;

    color: #252a32;
}


/* =========================
   SUDOKU BOARD
========================= */

.sudoku-board {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: grid;

    grid-template-columns: repeat(9, 1fr);

    grid-template-rows: repeat(9, 1fr);

    background: #252a32;

    border: 3px solid #252a32;

    border-radius: 8px;

    overflow: hidden;
}


/* =========================
   CELLS
========================= */

.cell {
    display: flex;

    align-items: center;
    justify-content: center;

    background: #ffffff;

    border-right: 1px solid #cfd4da;
    border-bottom: 1px solid #cfd4da;

    color: #3472d9;

    font-size: 22px;

    font-weight: 500;

    cursor: pointer;

    transition: background 0.15s;
}


/* Fixed numbers */

.cell.fixed {
    color: #252a32;

    background: #fafbfc;

    font-weight: 700;
}


/* Hover */

.cell:hover {
    background: #eaf2ff;
}


/* =========================
   VERTICAL 3x3 LINES
========================= */

/* After column 3 */

.cell:nth-child(3n) {
    border-right: 2px solid #252a32;
}


/* Last column */

.cell:nth-child(9n) {
    border-right: none;
}


/* =========================
   HORIZONTAL 3x3 LINES
========================= */

/* Bottom of row 3 */

.cell:nth-child(n+19):nth-child(-n+27) {
    border-bottom: 2px solid #252a32;
}


/* Bottom of row 6 */

.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #252a32;
}


/* Last row */

.cell:nth-child(n+73) {
    border-bottom: none;
}


/* =========================
   NUMBER PAD
========================= */

.number-pad {
    display: grid;

    grid-template-columns: repeat(9, 1fr);

    gap: 7px;

    margin-top: 20px;
}


.number-pad button {
    height: 42px;

    border: 1px solid #d9dee5;

    border-radius: 7px;

    background: #ffffff;

    color: #252a32;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.15s;
}


.number-pad button:hover {
    background: #eaf2ff;

    border-color: #8db2e9;

    color: #2866cb;
}


.number-pad button:active {
    transform: scale(0.95);
}


/* =========================
   BOTTOM CONTROLS
========================= */

.controls {
    display: flex;

    gap: 10px;

    margin-top: 18px;
}


.control-btn,
.check-btn {
    flex: 1;

    height: 42px;

    border-radius: 7px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}


.control-btn {
    background: #ffffff;

    border: 1px solid #d9dee5;

    color: #343a42;
}


.control-btn:hover {
    background: #f0f2f5;
}


.check-btn {
    background: #3774df;

    border: 1px solid #3774df;

    color: #ffffff;
}


.check-btn:hover {
    background: #2862c8;

    border-color: #2862c8;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {
        height: 60px;

        padding: 0 18px;
    }


    .logo {
        font-size: 21px;
    }


    .new-game {
        padding: 0 10px;

        font-size: 12px;
    }


    .theme-btn {
        width: 35px;

        height: 35px;
    }


    .container {
        margin-top: 20px;
    }


    .game-info {
        padding: 12px 15px;
    }


    .cell {
        font-size: 18px;
    }


    .number-pad {
        gap: 4px;
    }


    .number-pad button {
        height: 38px;

        font-size: 14px;
    }


    .controls {
        gap: 7px;
    }


    .control-btn,
    .check-btn {
        height: 40px;

        font-size: 12px;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .game-info {
        padding: 10px;
    }


    .info-item span {
        font-size: 8px;
    }


    .info-item strong {
        font-size: 12px;
    }


    .number-pad button {
        height: 34px;

        font-size: 13px;
    }


    .controls {
        flex-direction: column;
    }
}
     </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            Sudoku
        </div>

        <div class="header-right">
            <button class="new-game">
                New Game
            </button>

            <button class="theme-btn">
                ☀
            </button>
        </div>

    </header>


    <!-- MAIN -->
    <main class="container">

        <!-- GAME INFORMATION -->
        <section class="game-info">

            <div class="info-item">
                <span>DIFFICULTY</span>
                <strong>Easy</strong>
            </div>

            <div class="info-item">
                <span>TIME</span>
                <strong>00:00</strong>
            </div>

            <div class="info-item">
                <span>MISTAKES</span>
                <strong>0 / 3</strong>
            </div>

        </section>


        <!-- SUDOKU BOARD -->
        <section class="sudoku-board">

            <!-- ROW 1 -->
            <div class="cell fixed">5</div>
            <div class="cell fixed">3</div>
            <div class="cell"></div>

            <div class="cell fixed">6</div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell fixed">9</div>
            <div class="cell fixed">8</div>


            <!-- ROW 2 -->
            <div class="cell fixed">6</div>
            <div class="cell"></div>
            <div class="cell fixed">2</div>

            <div class="cell fixed">8</div>
            <div class="cell"></div>
            <div class="cell fixed">7</div>

            <div class="cell"></div>
            <div class="cell fixed">1</div>
            <div class="cell fixed">4</div>


            <!-- ROW 3 -->
            <div class="cell fixed">1</div>
            <div class="cell fixed">9</div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell fixed">4</div>
            <div class="cell"></div>

            <div class="cell fixed">5</div>
            <div class="cell fixed">6</div>
            <div class="cell"></div>


            <!-- ROW 4 -->
            <div class="cell fixed">8</div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell fixed">1</div>
            <div class="cell fixed">2</div>
            <div class="cell fixed">9</div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell fixed">6</div>


            <!-- ROW 5 -->
            <div class="cell fixed">2</div>
            <div class="cell fixed">4</div>
            <div class="cell"></div>

            <div class="cell fixed">8</div>
            <div class="cell"></div>
            <div class="cell fixed">5</div>

            <div class="cell"></div>
            <div class="cell fixed">7</div>
            <div class="cell fixed">1</div>


            <!-- ROW 6 -->
            <div class="cell fixed">4</div>
            <div class="cell fixed">5</div>
            <div class="cell fixed">7</div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell fixed">6</div>

            <div class="cell"></div>
            <div class="cell fixed">3</div>
            <div class="cell fixed">2</div>


            <!-- ROW 7 -->
            <div class="cell fixed">9</div>
            <div class="cell"></div>
            <div class="cell fixed">3</div>

            <div class="cell fixed">4</div>
            <div class="cell fixed">5</div>
            <div class="cell"></div>

            <div class="cell fixed">1</div>
            <div class="cell"></div>
            <div class="cell fixed">8</div>


            <!-- ROW 8 -->
            <div class="cell"></div>
            <div class="cell fixed">2</div>
            <div class="cell fixed">8</div>

            <div class="cell"></div>
            <div class="cell fixed">3</div>
            <div class="cell fixed">7</div>

            <div class="cell fixed">4</div>
            <div class="cell"></div>
            <div class="cell fixed">9</div>


            <!-- ROW 9 -->
            <div class="cell fixed">3</div>
            <div class="cell"></div>
            <div class="cell fixed">5</div>

            <div class="cell fixed">9</div>
            <div class="cell"></div>
            <div class="cell fixed">4</div>

            <div class="cell fixed">8</div>
            <div class="cell"></div>
            <div class="cell"></div>

        </section>


        <!-- NUMBER PAD -->
        <section class="number-pad">

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>

        </section>


        <!-- BOTTOM CONTROLS -->
        <section class="controls">

            <button class="control-btn">
                ⌫ &nbsp; Erase
            </button>

            <button class="control-btn">
                ✎ &nbsp; Notes
            </button>

            <button class="check-btn">
                Check
            </button>

        </section>

    </main>

</body>
</html>
