   <form action="/submit" method="post" novalidate>
  <label for="email">Email (required):</label>
  <input type="email" id="email" name="email" required>

  <label for="username">Username (required):</label>

<form action="/submit" method="post" enctype="application/x-www-form-urlencoded">
  <!-- This is the default enctype. It encodes form data as key=value pairs 
       like name=John&email=test@test.com and is suitable for text data.
       It is default because 99% of forms only send text. -->

  <label for="name">Name:</label>
  <input type="text" id="name" name="name">
  <br><br>

  <label for="email2">Email:</label>
  <input type="email" id="email2" name="email2">
  <br><br>

  <input type="submit" value="Submit">
</form>
<br><br>
<form method="post" enctype="multipart/form-data" action="/upload">

    <button>submit</button>
</form><br><br>
<form   action="/submit" enctype="text/plain" method="post" autocomplete="on">
